name: Build StudyFocus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./Studyfocus

      - name: Build APK
        run: flutter build apk --release
        working-directory: ./Studyfocus

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyFocus-APK
          path: Studyfocus/build/app/outputs/flutter-apk/app-release.apk
          
